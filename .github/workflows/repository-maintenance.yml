name: Daily Repository Maintenance

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      enable_maintenance_pr:
        description: "Create the maintenance PR (requires repository policy to allow Actions PR creation)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run maintenance audit
        run: python automation/repository_maintenance.py

      # GitHub Actions can be granted pull-request write permission in the workflow,
      # but repository policy may still prohibit Actions from creating pull requests.
      # Keep PR creation opt-in so the scheduled audit remains truthful and green.
      - name: Create pull request when explicitly enabled
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_maintenance_pr == true }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: daily repository maintenance"
          title: "chore: daily repository maintenance"
          body: |
            Automated documentation-only maintenance patch.
            See `MAINTENANCE_REPORT.md` for audit findings.
          branch: "maintenance/daily-audit"
          draft: true

      - name: Report pull-request creation policy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_maintenance_pr != true }}
        run: echo "Maintenance audit completed; pull-request creation is disabled unless ENABLE_MAINTENANCE_PR=true."
