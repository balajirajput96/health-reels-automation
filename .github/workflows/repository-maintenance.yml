name: Daily Repository Maintenance

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run maintenance audit
        run: python automation/repository_maintenance.py

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: daily repository maintenance"
          title: "chore: daily repository maintenance"
          body: |
            Automated documentation-only maintenance patch.
            See `MAINTENANCE_REPORT.md` for audit findings.
          branch: "maintenance/daily-audit"
          draft: true
