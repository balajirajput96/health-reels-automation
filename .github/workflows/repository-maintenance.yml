name: Daily Repository Maintenance

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-repository-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run non-destructive maintenance audit
        run: python automation/repository_maintenance.py

      - name: Upload maintenance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repository-maintenance-${{ github.run_id }}
          path: MAINTENANCE_REPORT.md
          if-no-files-found: warn
          retention-days: 90

      - name: Report execution boundary
        if: ${{ always() }}
        run: |
          echo "Maintenance completed as a read-only repository audit."
          echo "No pull request, commit, Drive operation, media generation, or social action is performed by this workflow."
