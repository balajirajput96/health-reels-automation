name: Daily Automation Audit

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out policy repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate idempotency ledger
        run: python automation/state_guard.py status

      - name: Run idempotency guard tests
        run: python -m unittest discover -s tests -v

      - name: Run manifest-driven repository health check
        run: |
          mkdir -p "$RUNNER_TEMP/health-reels-maintenance"
          python automation/health_check.py \
            --report-json "$RUNNER_TEMP/health-reels-maintenance/health-check.json" \
            --summary-md "$RUNNER_TEMP/health-reels-maintenance/health-check.md"

      - name: Add health-check summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/health-reels-maintenance/health-check.md" ]; then
            cat "$RUNNER_TEMP/health-reels-maintenance/health-check.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Repository Health Check" >> "$GITHUB_STEP_SUMMARY"
            echo "Health-check output was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload health-check artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: health-reels-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/health-reels-maintenance
          if-no-files-found: warn
          retention-days: 14

      - name: Verify required operational documents
        run: |
          test -f policy/ZERO_TOUCH_REELS_OPERATING_POLICY.md
          test -f standards/HEALTH_CONTENT_EDITORIAL_STANDARD.md
          test -f docs/AUTONOMOUS_SOCIAL_VIDEO_AUTOMATION_BLUEPRINT.md
          test -f docs/cross_platform_integration_audit.md

      - name: Report safety boundary
        run: |
          echo "This workflow is documentation-only."
          echo "It does not access social accounts, browser sessions, Drive, APIs, or credentials."
          echo "It cannot publish, create media, alter schedules, or modify secrets."
