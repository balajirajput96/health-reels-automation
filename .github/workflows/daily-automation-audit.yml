name: Daily Automation Audit

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out policy repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate idempotency ledger
        run: python automation/state_guard.py status

      - name: Validate active Drive production checkpoint
        run: python automation/drive_checkpoint_guard.py

      - name: Run idempotency guard tests
        run: python -m unittest discover -s tests -v

      - name: Run manifest-driven repository health check
        run: |
          mkdir -p "$RUNNER_TEMP/health-reels-maintenance"
          python automation/health_check.py \
            --report-json "$RUNNER_TEMP/health-reels-maintenance/health-check.json" \
            --summary-md "$RUNNER_TEMP/health-reels-maintenance/health-check.md"

      - name: Run CLI continuity manifest check
        run: |
          python automation/continuity_check.py \
            --report-json "$RUNNER_TEMP/health-reels-maintenance/cli-continuity.json" \
            --summary-md "$RUNNER_TEMP/health-reels-maintenance/cli-continuity.md"

      - name: Add maintenance summaries
        if: ${{ always() }}
        run: |
          for summary in \
            "$RUNNER_TEMP/health-reels-maintenance/health-check.md" \
            "$RUNNER_TEMP/health-reels-maintenance/cli-continuity.md"; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Missing expected maintenance summary: $summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload health-check artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: health-reels-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/health-reels-maintenance
          if-no-files-found: warn
          retention-days: 90

      - name: Verify required operational documents
        run: |
          test -f policy/ZERO_TOUCH_REELS_OPERATING_POLICY.md
          test -f standards/HEALTH_CONTENT_EDITORIAL_STANDARD.md
          test -f docs/AUTONOMOUS_SOCIAL_VIDEO_AUTOMATION_BLUEPRINT.md
          test -f docs/cross_platform_integration_audit.md

      - name: Report safety boundary
        run: |
          echo "This workflow is deterministic and non-secret."
          echo "It validates repository metadata and generated reports only."
          echo "It does not access social accounts, browser sessions, Drive, APIs, credentials, or local CLI credential stores."
          echo "It cannot publish, create media, alter schedules, or modify secrets."
